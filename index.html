<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FOOTBALL LIFE 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toast"></div>

  <section id="startScreen" class="start-screen">
    <div class="start-card glass">
      <div class="eyebrow">FOOTBALL LIFE 4 · CAREER & LIFE SIMULATOR</div>
      <h1>한 명의 축구선수로<br><span>평생을 살아간다.</span></h1>
      <p>유망주 → 슈퍼스타 → 국가대표 → 이적시장 → 연애·결혼·가족 → 은퇴 → 감독·해설·사업가·구단주까지 이어지는 축구 인생 시뮬레이션.</p>
      <div class="start-grid">
        <label>선수 이름<input id="newName" value="Logan Lee" maxlength="24"></label>
        <label>국적<select id="newNation"></select></label>
        <label>포지션<select id="newPosition"><option>ST</option><option>LW</option><option>RW</option><option>CAM</option><option>CM</option><option>CDM</option><option>LB</option><option>RB</option><option>CB</option><option>GK</option></select></label>
        <label>시작 리그<select id="newLeague"></select></label>
        <label>성장 타입<select id="newArchetype"><option value="wonderkid">천재 유망주</option><option value="worker">노력형</option><option value="physical">피지컬형</option><option value="technical">테크니션</option></select></label>
        <label>난이도<select id="newDifficulty"><option value="normal">보통</option><option value="hard">현실적</option><option value="story">스토리 중심</option></select></label>
      </div>
      <div class="start-actions"><button class="primary big" onclick="Game.newCareer()">새 커리어 시작</button><button class="secondary big" onclick="Game.continueCareer()">저장된 커리어 계속</button></div>
      <p class="tiny">자동저장 + JSON 백업 지원. GitHub Pages에서 바로 실행됩니다.</p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">FL<span>4</span></div>
      <div class="mini-profile"><div id="avatar" class="avatar">LL</div><div class="mini-profile-text"><strong id="sideName">Logan Lee</strong><small id="sideClub">FC 서울</small></div></div>
      <nav>
        <button class="nav active" data-page="home">🏠 홈</button>
        <button class="nav" data-page="inbox">📨 인박스 / 라이브</button>
        <button class="nav" data-page="career">⚽ 선수 커리어</button>
        <button class="nav" data-page="league">🏆 리그 / 대회</button>
        <button class="nav" data-page="training">🏋️ 훈련</button>
        <button class="nav" data-page="transfer">🤝 이적 / 계약</button>
        <button class="nav" data-page="life">❤️ 인생 / 가족</button>
        <button class="nav" data-page="money">💳 돈 / 쇼핑</button>
        <button class="nav" data-page="scouting">🔎 스카우팅</button>
        <button class="nav" data-page="world">🌍 월드 DB</button>
        <button class="nav" data-page="legacy">👑 은퇴 / 레거시</button>
      </nav>
      <div class="side-bottom"><button onclick="Game.exportSave()">저장파일 내보내기</button><button onclick="document.getElementById('importFile').click()">저장파일 불러오기</button><input id="importFile" type="file" accept=".json" hidden onchange="Game.importSave(this.files[0])"><button class="danger" onclick="Game.reset()">커리어 삭제</button></div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="top-date"><div id="dateText" class="date">2026년 1주차</div><div id="seasonText" class="season">2026/27 시즌</div></div><div class="top-stats"><div><span>OVR</span><b id="topOvr">64</b></div><div><span>컨디션</span><b id="topFitness">92</b></div><div><span>잔액</span><b id="topMoney">₩2.0M</b></div><div><span>인생 단계</span><b id="topStage">PLAYER</b></div><button id="advanceBtn" class="advance" onclick="Game.advanceWeek()">다음 주 진행 ▶</button></div></header>
      <section id="page-home" class="page active"></section><section id="page-inbox" class="page"></section><section id="page-career" class="page"></section><section id="page-league" class="page"></section><section id="page-training" class="page"></section><section id="page-transfer" class="page"></section><section id="page-life" class="page"></section><section id="page-money" class="page"></section><section id="page-scouting" class="page"></section><section id="page-world" class="page"></section><section id="page-legacy" class="page"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card glass"><button class="x" onclick="UI.closeModal()">×</button><div id="modalBody"></div></div></div>

  <script src="js/pages_chunks/chunk-00.js"></script>
  <script src="js/pages_chunks/chunk-01.js"></script>
  <script src="js/pages_chunks/chunk-02.js"></script>
  <script src="js/pages_chunks/chunk-03.js"></script>
  <script src="js/pages_chunks/chunk-04.js"></script>
  <script src="js/pages_chunks/chunk-05.js"></script>
  <script src="js/pages_chunks/chunk-06.js"></script>
  <script src="js/pages_chunks/chunk-07.js"></script>
  <script src="js/pages_chunks/chunk-08.js"></script>
  <script src="js/pages_chunks/chunk-09.js"></script>
  <script src="js/pages_chunks/chunk-10.js"></script>
  <script src="js/pages-run.js"></script>
  <script src="js/pages-patch.js"></script>
</body>
</html>
